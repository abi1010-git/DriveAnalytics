name: Pages

# Builds the static site (VITE_STATIC=1) and deploys it to GitHub Pages. The data files are not
# in git: scripts/publish-data.ps1 uploads them to the data-latest release and starts this workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Download site data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release download data-latest -R "$GITHUB_REPOSITORY" -p site-data.tar.gz -D "$RUNNER_TEMP"; then
            echo "::error::Could not download site-data.tar.gz from the data-latest release. Run scripts/publish-data.ps1 to create it."
            exit 1
          fi
          mkdir -p public/data
          tar -xzf "$RUNNER_TEMP/site-data.tar.gz" -C public/data
          test -f public/data/meta.json || { echo "::error::site-data.tar.gz has no meta.json at its root."; exit 1; }
      - run: VITE_STATIC=1 npx vite build --base=/${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
